<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login System</title>

  <link rel="icon" href="images/unnamed111.jpg" type="image/x-icon">
  
  <link rel="stylesheet" href="stylesheet/loginsys.css">
</head>
<body>

<div class="container">
  <div class="form-box">

    <!-- Toggle Buttons -->
    <div class="button-box">
      <button id="loginBtn">Sign In</button>
      <button id="registerBtn">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="loginForm" class="form active">
      <h2>Sign In</h2>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>

      <div class="remember">
        <input class="checkboxx" type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember Me</label>
      </div>
  <a  class="linktohomepage" href="a.mstarts.html">
      <button type="submit">Login</button>
      <p id="loginMessage"></p>
    </form>
  </a>

    <!-- Sign Up Form -->
    <form id="registerForm" class="form">
      <h2>Sign Up</h2>
      <input type="text" id="registerName" placeholder="Full Name" required>
      <input type="email" id="registerEmail" placeholder="Email" required>
      <input type="password" id="registerPassword" placeholder="Password" required>

      <button type="submit">Register</button>
      <p id="registerMessage"></p>
    </form>

  </div>
</div>

<script type="module"src="script/loginsys.js"></script>
</body>
</html>
